<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SBCF Backend Test</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">
  <div class="brand-stripe"><span></span><span></span><span></span></div>
  <main class="wrap" style="padding-top:48px;max-width:760px">
    <section class="card" style="padding:28px">
      <h1 style="margin-top:0">SBCF backend connection test</h1>
      <p>This page tests only the browser ↔ Google Apps Script response. It does not create a registration.</p>
      <button class="button primary" id="testButton" type="button">Test connection</button>
      <div id="result" class="message" style="margin-top:18px"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="backend.js"></script>
  <script>
    document.getElementById("testButton").addEventListener("click", async () => {
      const result = document.getElementById("result");
      result.className = "message";
      result.textContent = "Testing…";
      try {
        const r = await backendRequest("ping", {}, 15000);
        result.className = "message success";
        result.textContent = "Success: browser received the Apps Script response.";
      } catch (e) {
        result.className = "message error";
        result.textContent = "Failed: " + e.message;
      }
    });
  </script>
</body>
</html>
